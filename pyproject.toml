[project]
name = "fake-py-pathy-storage"
description = "Pathy storage for fake.py"
readme = "README.rst"
version = "0.1.7"
dependencies = [
    "fake.py>=0.9.5",
    "pathy>=0.10.0,<0.12.0",
]
authors = [
    {name = "Artur Barseghyan", email = "artur.barseghyan@gmail.com"},
]
maintainers = [
    {name = "Artur Barseghyan", email = "artur.barseghyan@gmail.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development",
]
keywords = ["fake data", "test data"]

[project.urls]
Homepage = "https://github.com/barseghyanartur/fake-py-pathy-storage/"
Issues = "https://github.com/barseghyanartur/fake-py-pathy-storage/issues"
Documentation = "https://fake-py-pathy-storage.readthedocs.io/"
Repository = "https://github.com/barseghyanartur/fake-py-pathy-storage/"
Changelog = "https://fake-py-pathy-storage.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
all = ["fake-py-pathy-storage[gcs,s3,azure,dev,test,docs,build]"]
build = [
    "build",
    "twine",
    "wheel",
]
dev = [
    "detect-secrets",
    "doc8",
    "ipython",
    "mypy",
    "pydoclint",
    "ruff",
    "uv",
]
test = [
    "django",
    "moto[s3]",
    "parametrize",
    "pytest",
    "pytest-codeblock",
    "pytest-cov",
    "pytest-django",
]
docs = [
    "sphinx<6.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-no-pragma",
    "sphinx-llms-txt-link",
    "sphinx-source-tree",
]
gcs = [
    "pathy[gcs]>=0.10.0,<0.12.0",
]
s3 = [
    "pathy[s3]>=0.10.0,<0.12.0",
]
azure = [
    "pathy[azure]>=0.10.0,<0.12.0",
]

[project.scripts]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "fakepy.pathy_storage",
    "fakepy.pathy_storage.tests",
]
namespaces = true

# Build system information below.
[build-system]
requires = ["setuptools>=41.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 80

# Enable Pyflakes `E` and `F` codes by default.
lint.select = [
    "B",  # Bugbear
    "C4",  # Complexity
    "E",  # pycodestyle
    "F",  # Pyflakes
    "G",  # Logging format
    "I",  # Isort
    "ISC",  # Implicit string concatenation
    "INP",  # Implicit namespace packages
    "N",  # Naming
    "PERF",  # Perflint
    "Q",  # Quotes
    "SIM",  # Simplify
    "TD",  # TO DO
]
lint.ignore = [
    "G004",  # Allow use of f-string in logging
    "ISC003",  # Allow explicitly concatenated strings
    "TD002",  # Allow to do without author
    "TD003",  # Allow to do without URL
]
fix = true

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "docs",
]
lint.per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.8.
target-version = "py38"

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = []

[tool.doc8]
ignore-path = [
    "docs/requirements.txt",
    "fake-py-pathy-storage.egg-info/SOURCES.txt",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "-vvv",
    "-q",
   "--cov=pathy_storage",
   "--ignore=.tox",
   "--ignore=requirements",
   "--ignore=release",
   "--ignore=tmp",
   "--cov-report=html",
   "--cov-report=term",
   "--cov-report=annotate",
   "--cov-append",
   "--capture=no",
]
testpaths = [
    "fakepy/pathy_storage/",
    "fakepy/pathy_storage_beta/",
    "tests.py",
    "test_*.py",
    "**/*.rst",
]
pythonpath = [
    ".",
    "fakepy/pathy_storage/",
    "fakepy/pathy_storage_beta/",
]

[tool.coverage.run]
relative_files = true
omit = [
    ".tox/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "@overload",
]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pydoclint]
style = 'sphinx'
exclude = '\.git|\.tox|tests/data|__copy_fake\.py'
require-return-section-when-returning-nothing = false
allow-init-docstring = true
arg-type-hints-in-docstring = false

[tool.sphinx-source-tree]
output = "docs/llms.rst"
ignore = [
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.py,cover",
    ".git",
    ".hg",
    ".svn",
    ".tox",
    ".nox",
    ".venv",
    "venv",
    "env",
    "*.egg-info",
    "dist",
    "build",
    "node_modules",
    ".mypy_cache",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    ".idea",
    ".vscode",
    ".DS_Store",
    "Thumbs.db",
    ".ruff_cache",
    ".coverage.*",
    ".secrets.baseline",
    ".pre-commit-config.yaml",
    ".pre-commit-hooks.yaml",
    ".readthedocs.yaml",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
    "LICENSE",
    "SECURITY.rst",
    "docs/_static",
    "docs/examples",
    "docs/changelog.rst",
    "docs/code_of_conduct.rst",
    "docs/documentation.rst",
    "docs/security.rst",
    "docs/source_tree.rst",
    "docs/make.bat",
    "docs/Makefile",
    "docs/readme.rst",
    "docs/requirements.txt",
    ".coveralls.yml",
    ".readthedocs.yaml",
]
order = [
    "README.rst",
    "CONTRIBUTING.rst",
]
